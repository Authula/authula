name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build
        run: make build

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check formatting
        run: make format

      - name: Verify no formatting changes
        run: git diff --exit-code

  vet:
    name: Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Run go vet
        run: make vet

  ci:
    name: Full CI Check
    runs-on: ubuntu-latest
    if: always()
    needs: [build, test, lint, format, vet]

    steps:
      - name: Verify CI results
        run: |
          if [[ "${{ needs.build.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.lint.result }}" != "success" ||
                "${{ needs.format.result }}" != "success" ||
                "${{ needs.vet.result }}" != "success" ]]; then
            echo "❌ One or more CI checks failed."
            exit 1
          fi

          echo "✅ All CI checks passed successfully!"
